<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/styles-CgNoLbqg.js"></script>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/vendor-BbbuE1sJ.js"></script>
    <script type="module" crossorigin src="/goit-advancedjs-hw-02/assets/1-timer-CMUEOoM9.js"></script>
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/styles-CA0bnszG.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-02/assets/vendor-CZjNVMTf.css">
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <input type="text" id="datetime-picker" />
        <button type="button" data-start disabled>Start</button>
      </div>

      <div class="timer">
        <div class="field">
          <span class="value" data-days>00</span>
          <span class="label">Days</span>
        </div>
        <div class="field">
          <span class="value" data-hours>00</span>
          <span class="label">Hours</span>
        </div>
        <div class="field">
          <span class="value" data-minutes>00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="field">
          <span class="value" data-seconds>00</span>
          <span class="label">Seconds</span>
        </div>
      </div>
    </div>

  </body>
</html>
